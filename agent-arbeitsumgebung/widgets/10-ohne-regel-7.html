<script>
(function () {
  var S = JSON.parse(document.getElementById('szene').textContent);
  var el = function (id) { return document.getElementById(id); };
  var chat = el('ma-chat'), erkl = el('ma-erkl'), weiter = el('ma-weiter'), neu = el('ma-neu');
  var dateien, schritt, wartet, fokus;

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // Inline nach dem Escapen: nur `code` und **fett**, kein HTML aus der Szene.
  function inline(t) {
    return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }

  function anhaengen(node) {
    var leer = chat.querySelector('.ma-leer'); if (leer) leer.remove();
    chat.appendChild(node); fokus = node; return node;
  }

  function nachricht(klasse, text, wer) {
    var d = document.createElement('div'); d.className = 'ma-msg ' + klasse;
    if (wer) { var w = document.createElement('span'); w.className = 'ma-who'; w.textContent = wer; d.appendChild(w); }
    d.appendChild(document.createTextNode(text));
    return anhaengen(d);
  }

  // Dateiinhalt als Zeilen mit Nummern; kuerzen zeigt nur markierte Zeilen
  // plus je eine Kontextzeile und ersetzt Lücken durch „…“.
  function roh(text, zeilen, kuerzen) {
    var marks = {}; (zeilen || []).forEach(function (z) { marks[z] = true; });
    var liste = String(text).split('\n'), sicht = null;
    if (kuerzen && zeilen && zeilen.length) {
      sicht = {};
      zeilen.forEach(function (z) { for (var k = z - 1; k <= z + 1; k++) sicht[k] = true; });
    }
    var html = '', luecke = false;
    liste.forEach(function (z, i) {
      var nr = i + 1;
      if (sicht && !sicht[nr]) { luecke = true; return; }
      if (luecke) { html += '<div class="luecke"><span class="nr"></span><span>…</span></div>'; luecke = false; }
      var inhalt = /^#{1,6} /.test(z) ? '<span class="h">' + esc(z) + '</span>' : esc(z);
      html += '<div' + (marks[nr] ? ' class="mark"' : '') + '><span class="nr">' + nr + '</span><span>' + (inhalt || ' ') + '</span></div>';
    });
    if (luecke) html += '<div class="luecke"><span class="nr"></span><span>…</span></div>';
    return '<pre>' + html + '</pre>';
  }

  // Minimal-Markdown: Überschriften, Listen (- oder *), Tabellen mit
  // Trennzeile, Absätze. Text wird escaped.
  function vorschau(text) {
    var z = String(text).split('\n'), html = '', i = 0;
    var zellen = function (s) { return s.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); }); };
    var trenn = function (s) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s || ''); };
    while (i < z.length) {
      var s = z[i], m;
      if (!s.trim()) { i++; continue; }
      if ((m = /^(#{1,6})\s+(.*)$/.exec(s))) { html += '<div class="h' + Math.min(m[1].length, 3) + '">' + inline(m[2]) + '</div>'; i++; continue; }
      if (/^\s*[-*]\s+/.test(s)) {
        html += '<ul>';
        while (i < z.length && /^\s*[-*]\s+/.test(z[i])) { html += '<li>' + inline(z[i].replace(/^\s*[-*]\s+/, '')) + '</li>'; i++; }
        html += '</ul>'; continue;
      }
      if (s.indexOf('|') >= 0 && trenn(z[i + 1])) {
        html += '<table><thead><tr>' + zellen(s).map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
        i += 2;
        while (i < z.length && z[i].indexOf('|') >= 0 && z[i].trim()) {
          html += '<tr>' + zellen(z[i]).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; i++;
        }
        html += '</tbody></table>'; continue;
      }
      var abs = [];
      while (i < z.length && z[i].trim() && !/^(#{1,6})\s|^\s*[-*]\s+/.test(z[i]) && !(z[i].indexOf('|') >= 0 && trenn(z[i + 1]))) { abs.push(inline(z[i].trim())); i++; }
      html += '<p>' + abs.join(' ') + '</p>';
    }
    return '<div class="ma-vor">' + (html || '<p>(leer)</p>') + '</div>';
  }

  function dateiBeitrag(pfad, inhaltHtml) {
    var d = document.createElement('div'); d.className = 'ma-msg agent datei';
    d.innerHTML = '<span class="ma-pfad">' + esc(pfad) + '</span>' + inhaltHtml;
    return anhaengen(d);
  }

  function inhalt(pfad) { return pfad in dateien ? dateien[pfad] : ''; }

  function zeigeAls(pfad, als) {
    dateiBeitrag(pfad, als === 'vorschau' ? vorschau(inhalt(pfad)) : roh(inhalt(pfad)));
  }

  function diffHtml(d) {
    var h = '';
    (d.alt || []).forEach(function (z) { h += '<div class="alt"><span class="nr">−</span><span>' + (esc(z) || ' ') + '</span></div>'; });
    (d.neu || []).forEach(function (z) { h += '<div class="neu"><span class="nr">+</span><span>' + (esc(z) || ' ') + '</span></div>'; });
    return (d.pfad ? '<span class="ma-pfad">' + esc(d.pfad) + '</span>' : '') + '<pre>' + h + '</pre>';
  }

  function aktion(a) {
    if (a.nutzer) nachricht('nutzer', a.nutzer, 'Sie');
    if (a.agent) nachricht('agent', a.agent, 'Agent');
    if (a.liest) {
      nachricht('werkzeug', 'liest ' + a.liest);
      dateiBeitrag(a.liest, roh(inhalt(a.liest), a.zeilen, a.kuerzen));
    }
    if (a.schreibt) {
      var war = a.schreibt in dateien;
      dateien[a.schreibt] = a.inhalt;
      nachricht('werkzeug', (war ? 'ändert ' : 'legt an ') + a.schreibt);
      if (a.zeigen === 'roh' || a.zeigen === 'vorschau') zeigeAls(a.schreibt, a.zeigen);
    }
    if (a.zeigt) zeigeAls(a.zeigt, a.als);
    if (a.verschiebt) {
      dateien[a.nach] = dateien[a.verschiebt]; delete dateien[a.verschiebt];
      nachricht('werkzeug', 'verschiebt ' + a.verschiebt + ' → ' + a.nach);
    }
    if (a.werkzeug) nachricht('werkzeug', 'ruft auf ' + a.werkzeug);
    if (a.frage) {
      wartet = true;
      var aend = a.art === 'aenderung';
      var box = document.createElement('div'); box.className = 'ma-frage';
      box.innerHTML = '<span class="ma-who">' + (aend ? 'Änderung' : 'Agent') + '</span><p>' + esc(a.frage) + '</p>' +
        (a.diff ? diffHtml(a.diff) : '') +
        '<div class="knoepfe"><button type="button" class="prim" data-j="1">' + (aend ? 'Annehmen' : 'Erlauben') + '</button><button type="button" data-j="0">Ablehnen</button></div>';
      anhaengen(box);
      box.addEventListener('click', function (e) {
        var j = e.target.getAttribute && e.target.getAttribute('data-j'); if (j === null || !wartet) return;
        wartet = false;
        box.querySelector('.knoepfe').outerHTML = '<p class="status">' + (j === '1' ? (aend ? '✓ Angenommen' : '✓ Erlaubt') : '✕ Abgelehnt') + '</p>';
        if (j === '1') { weiter.disabled = false; weiter.focus(); }
        else {
          nachricht('agent', a.abgelehnt || 'In Ordnung, ich mache das nicht.', 'Agent'); scrollen();
          schritt = S.schritte.length;
          erkl.innerHTML = '<small>Ende</small>Ohne Erlaubnis ändert der Agent nichts im Ordner. Mit „Neu starten“ sehen Sie den anderen Weg.';
          weiter.disabled = true;
        }
      });
      weiter.disabled = true;
    }
  }

  // Autoscroll: ans Ende; zeigt der neue Beitrag markierte Zeilen, die erste
  // Markierung sichtbar halten (lange Dateien laufen sonst aus dem Bild).
  function scrollen() {
    chat.scrollTop = chat.scrollHeight;
    var mark = fokus && fokus.querySelector && fokus.querySelector('.mark');
    if (mark) {
      var oben = mark.getBoundingClientRect().top - chat.getBoundingClientRect().top;
      if (oben < 0) chat.scrollTop = Math.max(0, chat.scrollTop + oben - 40);
    }
  }

  function los(i) {
    schritt = i; fokus = null;
    var s = S.schritte[i];
    erkl.innerHTML = '<small>Schritt ' + (i + 1) + ' von ' + S.schritte.length + '</small>' + esc(s.erklaerung);
    s.aktionen.forEach(aktion);
    scrollen();
    if (wartet) { var knopf = chat.querySelector('.ma-frage:last-child button'); if (knopf) knopf.focus({ preventScroll: true }); }
    else weiter.disabled = i >= S.schritte.length - 1;
    weiter.textContent = i >= S.schritte.length - 1 ? 'Fertig' : 'Weiter';
  }

  function start() {
    dateien = JSON.parse(JSON.stringify(S.dateien)); wartet = false; fokus = null;
    el('ma-titel').textContent = S.titel;
    chat.innerHTML = '<p class="ma-leer">Noch keine Nachrichten</p>';
    los(0);
  }

  weiter.addEventListener('click', function () { if (!wartet && schritt < S.schritte.length - 1) los(schritt + 1); });
  neu.addEventListener('click', start);
  start();
})();
</script>
</body></html>
