<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="490" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">AGENTS.md: die Hausordnung in zwei Teilen</text><rect x="30" y="64" width="490" height="350" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><path d="M40,64 H510 Q520,64 520,74 V100 H30 V74 Q30,64 40,64 Z" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="48" y="88" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">AGENTS.md</text><rect x="50" y="114" width="146.8" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="123.4" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Teil 1: Zweck</text><text x="50" y="172" font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="start" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">#</tspan><tspan fill="#18181b" font-weight="400"> Kundenanfragen</tspan></text><text x="50" y="198" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Zwei Sätze, worum es im Ordner geht.</text><rect x="50" y="218" width="156.4" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="128.2" y="236" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Teil 2: Regeln</text><text x="50" y="276" font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="start" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">##</tspan><tspan fill="#18181b" font-weight="400"> Regeln</tspan></text><text x="50" y="306" font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="start" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">1.</tspan><tspan fill="#18181b" font-weight="400"> Antworte auf Deutsch.</tspan></text><text x="50" y="330" font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="start" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">2.</tspan><tspan fill="#18181b" font-weight="400"> Nur Fakten aus dem Ordner.</tspan></text><text x="50" y="354" font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="start" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">3.</tspan><tspan fill="#18181b" font-weight="400"> Keine Personennamen.</tspan></text><text x="50" y="378" font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="start" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">4.</tspan><tspan fill="#18181b" font-weight="400"> Ergebnisse als neue Datei.</tspan></text><text x="50" y="402" font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="start" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">5.</tspan><tspan fill="#18181b" font-weight="400"> Geänderte Dateien nennen.</tspan></text><rect x="550" y="64" width="420" height="120" rx="10" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><rect x="572" y="112" width="32" height="26" rx="7" stroke="#0052ff" stroke-width="2" fill="#ffffff"/><circle cx="582" cy="124" r="3" fill="#0052ff"/><circle cx="594" cy="124" r="3" fill="#0052ff"/><line x1="588" y1="112" x2="588" y2="105" stroke="#0052ff" stroke-width="2"/><text x="620" y="104" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="start">Liest der Agent zu Beginn</text><text x="620" y="126" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="start">jeder Sitzung</text><text x="620" y="152" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">wie ein neuer Mitarbeiter</text><text x="620" y="174" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">die Hausordnung jeden Morgen</text><rect x="550" y="206" width="420" height="208" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="570" y="236" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Prüfbare Regel?</text><circle cx="586" cy="284" r="14" stroke="#18181b" stroke-width="2" fill="#ffffff"/><path d="M579,284 L584,290 L594,278" stroke="#16a34a" stroke-width="3" fill="none"/><text x="614" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#16a34a" text-anchor="start">Beträge in EUR mit Komma</text><text x="614" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">am Ergebnis kontrollierbar</text><circle cx="586" cy="362" r="14" stroke="#dc2626" stroke-width="2" fill="#ffffff"/><path d="M580,356 L592,368 M592,356 L580,368" stroke="#dc2626" stroke-width="3" fill="none"/><text x="614" y="358" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#dc2626" text-anchor="start">Schreibe sorgfältig</text><text x="614" y="380" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">niemand kann es prüfen</text><rect x="30" y="432" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Fünf bis zehn kurze Regeln, nummeriert: Dann genügt im Gespräch „Regel 2“.</text></svg>