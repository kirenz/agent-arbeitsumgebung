<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Eine Frage ohne Antwort im Ordner</text><rect x="30" y="100" width="200" height="100" rx="10" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="130.0" y="133.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Frage im Chat</text><text x="130.0" y="155.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">„Wie teuer ist eine</text><text x="130.0" y="176.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Reparatur?“</text><rect x="280" y="100" width="200" height="100" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="380.0" y="144.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Agent sucht im Ordner</text><text x="380.0" y="166.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">keine Preisliste</text><rect x="530" y="100" width="200" height="100" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="630.0" y="144.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Nur Fakten aus Dateien</text><text x="630.0" y="166.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">sonst „Annahme:“</text><rect x="780" y="100" width="190" height="100" rx="10" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="875.0" y="133.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Antwort</text><text x="875.0" y="155.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">„Annahme:</text><text x="875.0" y="176.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Preisliste fehlt“</text><rect x="580" y="70" width="89.2" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="624.6" y="88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Regel 2</text><line x1="234" y1="150" x2="276" y2="150" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><line x1="484" y1="150" x2="526" y2="150" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><line x1="734" y1="150" x2="776" y2="150" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="228" width="940" height="118" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="50" y="258" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Was gegriffen hat:</text><circle cx="66" cy="296" r="16" fill="#0052ff"/><text x="66" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="92" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Antwort auf Deutsch</text><circle cx="346" cy="296" r="16" fill="#0052ff"/><text x="346" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="372" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Lücke mit „Annahme:“</text><text x="372" y="324" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">gekennzeichnet</text><circle cx="656" cy="296" r="16" fill="#0052ff"/><text x="656" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="682" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">„Angelegt oder geändert:</text><text x="682" y="324" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">keine Dateien“</text><rect x="30" y="366" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="394" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Regeln senken das Risiko. Preise, Termine und Zusagen weiter gegen die Quelle prüfen.</text></svg>