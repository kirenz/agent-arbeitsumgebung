<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Was in den Projektordner darf</text><rect x="30" y="62" width="455" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="54" y="96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16a34a" text-anchor="start">Geeignet</text><path d="M56,134 l6,7 l12,-13" stroke="#16a34a" stroke-width="3" fill="none"/><text x="86" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">eigene Vorlagen</text><path d="M56,176 l6,7 l12,-13" stroke="#16a34a" stroke-width="3" fill="none"/><text x="86" y="182" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Preislisten, Produktbeschreibungen</text><path d="M56,218 l6,7 l12,-13" stroke="#16a34a" stroke-width="3" fill="none"/><text x="86" y="224" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Abläufe und Checklisten</text><path d="M56,260 l6,7 l12,-13" stroke="#16a34a" stroke-width="3" fill="none"/><text x="86" y="266" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Kopien von Anfragen ohne Namen</text><rect x="515" y="62" width="455" height="250" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="539" y="96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626" text-anchor="start">Nicht in den Ordner</text><circle cx="549" cy="134" r="14" stroke="#dc2626" stroke-width="2" fill="#ffffff"/><path d="M543,128 L555,140 M555,128 L543,140" stroke="#dc2626" stroke-width="3" fill="none"/><text x="571" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Personendaten (Namen, Adressen, Telefon)</text><circle cx="549" cy="176" r="14" stroke="#dc2626" stroke-width="2" fill="#ffffff"/><path d="M543,170 L555,182 M555,170 L543,182" stroke="#dc2626" stroke-width="3" fill="none"/><text x="571" y="182" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Zugangsdaten, Verträge</text><circle cx="549" cy="218" r="14" stroke="#dc2626" stroke-width="2" fill="#ffffff"/><path d="M543,212 L555,224 M555,212 L543,224" stroke="#dc2626" stroke-width="3" fill="none"/><text x="571" y="224" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Gesundheits- und Finanzdaten von Personen</text><circle cx="549" cy="260" r="14" stroke="#dc2626" stroke-width="2" fill="#ffffff"/><path d="M543,254 L555,266 M555,254 L543,266" stroke="#dc2626" stroke-width="3" fill="none"/><text x="571" y="266" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">vertraulich gekennzeichnete Dokumente</text><rect x="30" y="336" width="300" height="64" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="180.0" y="362.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Projektordner</text><text x="180.0" y="384.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">auf Ihrem Rechner</text><line x1="340" y1="368" x2="650" y2="368" stroke="#0052ff" stroke-width="2" marker-end="url(#ab)"/><text x="495" y="356" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Agent liest und sendet</text><rect x="660" y="336" width="310" height="64" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="815.0" y="362.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Anbieter des Sprachmodells</text><text x="815.0" y="384.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">verarbeitet den Inhalt</text><rect x="30" y="414" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="442" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Was der Agent liest, geht an den Anbieter. Namen vorher durch Rollen ersetzen.</text></svg>