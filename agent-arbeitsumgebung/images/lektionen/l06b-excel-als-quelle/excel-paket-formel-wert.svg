<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="1000" height="412"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="412" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Eine Excel-Datei: ein Paket, Formeln und Werte</text><rect x="30" y="66" width="440" height="250" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="54" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="start">Paket</text><text x="120" y="98" font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="start" xml:space="preserve"><tspan fill="#18181b" font-weight="700">auftragsliste-2026.xlsx</tspan></text><rect x="54" y="122" width="192" height="50" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="150.0" y="151.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">Blätter</text><rect x="254" y="122" width="192" height="50" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="350.0" y="151.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">Zellen</text><rect x="54" y="184" width="192" height="50" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="150.0" y="213.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">Formeln</text><rect x="254" y="184" width="192" height="50" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="350.0" y="213.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">Formate</text><text x="54" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Text liest der Agent direkt, das Paket nur</text><text x="54" y="303" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">mit einem Werkzeug.</text><text x="530" y="96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Zelle G5, was wir sehen</text><rect x="530" y="108" width="200" height="52" rx="4" fill="#ffffff" stroke="#0052ff" stroke-width="2"/><text x="716" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#18181b" text-anchor="end">45,00</text><text x="530" y="206" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Zelle G5, was gespeichert ist</text><rect x="530" y="218" width="200" height="52" rx="4" fill="#e8efff" stroke="#0052ff" stroke-width="2"/><text x="546" y="252" font-family="ui-monospace, Menlo, monospace" font-size="18" text-anchor="start" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">=D5*F5</tspan></text><text x="760" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Das Tabellenprogramm</text><text x="760" y="153" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">rechnet beim Öffnen.</text><text x="760" y="242" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="start">Die Formelzeile zeigt</text><text x="760" y="263" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="start">den Unterschied.</text><rect x="30" y="340" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Wert und Formel sehen in der Zelle gleich aus: als Zahl.</text></svg>