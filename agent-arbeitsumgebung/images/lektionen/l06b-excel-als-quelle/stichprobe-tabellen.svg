<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="440" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Drei Prüfstellen, drei Fallen</text><text x="86" y="78" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#52525b" text-anchor="start">Prüfstelle</text><text x="620" y="78" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#52525b" text-anchor="start">deckt auf</text><circle cx="52" cy="131" r="16" fill="#0052ff"/><text x="52" y="137" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="86" y="94" width="470" height="74" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="321.0" y="135.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Datenzeilen je Blatt zählen</text><line x1="564" y1="131" x2="606" y2="131" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="614" y="94" width="356" height="74" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="792.0" y="125.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">ein fehlendes Blatt oder eine</text><text x="792.0" y="146.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">fehlende Zeile</text><circle cx="52" cy="223" r="16" fill="#0052ff"/><text x="52" y="229" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="86" y="186" width="470" height="74" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="321.0" y="227.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Ein Datum vergleichen</text><line x1="564" y1="223" x2="606" y2="223" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="614" y="186" width="356" height="74" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="792.0" y="217.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">falsche Umrechnung, etwa 46206 statt</text><text x="792.0" y="238.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">2026-07-03</text><circle cx="52" cy="315" r="16" fill="#0052ff"/><text x="52" y="321" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="86" y="278" width="470" height="74" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="321.0" y="319.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Einen Wert aus einer Formelzelle vergleichen</text><line x1="564" y1="315" x2="606" y2="315" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="614" y="278" width="356" height="74" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="792.0" y="319.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">Formeln statt Werte</text><rect x="30" y="376" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="404" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Zeile und Spalte beziehen sich auf das Original im Tabellenprogramm.</text></svg>