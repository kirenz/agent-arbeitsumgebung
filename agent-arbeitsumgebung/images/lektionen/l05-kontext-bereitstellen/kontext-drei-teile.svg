<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="440" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Kontext: was der Agent für einen Auftrag liest</text><rect x="30" y="70" width="290" height="170" rx="10" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><circle cx="60" cy="102" r="16" fill="#0052ff"/><text x="60" y="108" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="86" y="108" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Der Auftrag</text><text x="52" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">„Welche Anfrage ist</text><text x="52" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">die älteste?“</text><line x1="52" y1="192" x2="298" y2="192" stroke="#d4d4d8" stroke-width="1"/><text x="52" y="220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">bei jedem Auftrag</text><rect x="355" y="70" width="290" height="170" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><circle cx="385" cy="102" r="16" fill="#0052ff"/><text x="385" y="108" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="411" y="108" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Die Anweisungsdatei</text><text x="377" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">AGENTS.md mit</text><text x="377" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">den Regeln</text><line x1="377" y1="192" x2="623" y2="192" stroke="#d4d4d8" stroke-width="1"/><text x="377" y="220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">zu Beginn jeder Sitzung</text><rect x="680" y="70" width="290" height="170" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><circle cx="710" cy="102" r="16" fill="#0052ff"/><text x="710" y="108" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="736" y="108" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Dateien, die er öffnet</text><text x="702" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">etwa UEBERSICHT.md,</text><text x="702" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">später die Preisliste</text><line x1="702" y1="192" x2="948" y2="192" stroke="#d4d4d8" stroke-width="1"/><text x="702" y="220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">wenn er sie braucht</text><text x="337.5" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#52525b" text-anchor="middle">+</text><text x="662.5" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#52525b" text-anchor="middle">+</text><rect x="30" y="266" width="940" height="82" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="50" y="298" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Nicht dabei: was der Agent in einer früheren Sitzung gelesen hat.</text><text x="50" y="326" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Was im Ordner liegt, kann er jederzeit wieder öffnen.</text><rect x="30" y="372" width="940" height="44" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="48" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Mehr ist nicht besser: Eine alte Datei neben der neuen kann zur falschen Zahl führen.</text></svg>