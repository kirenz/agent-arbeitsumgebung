<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="500" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Wo ein Agent seine Verbindungen eingetragen hat</text><rect x="30" y="64" width="560" height="220" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="310" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">in einer Konfigurationsdatei</text><text x="310" y="122" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">einer Datei mit Einstellungen</text><rect x="54" y="146" width="250" height="112" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="179.0" y="185.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">im Projektordner</text><text x="179.0" y="207.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">gilt für dieses</text><text x="179.0" y="228.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Projekt</text><rect x="316" y="146" width="250" height="112" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="441.0" y="185.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">im Benutzerordner</text><text x="441.0" y="207.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Pfad beginnt mit ~,</text><text x="441.0" y="228.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">gilt für alle Projekte</text><text x="615" y="182" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#52525b" text-anchor="middle">oder</text><rect x="640" y="64" width="330" height="220" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="805" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">in den Einstellungen</text><text x="805" y="122" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">der App</text><rect x="664" y="146" width="282" height="112" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="805.0" y="196.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Bereich für MCP</text><text x="805.0" y="218.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">oder für Konnektoren</text><path d="M310,288 L310,322 L420,322 L420,352" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M805,288 L805,322 L580,322 L580,352" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="250" y="356" width="500" height="64" rx="10" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="500.0" y="382.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0052ff" text-anchor="middle">Liste der MCP-Server</text><text x="500.0" y="404.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">zum Beispiel kalender mit zwei Werkzeugen</text><rect x="30" y="440" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="468.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Im Kurs genügt die Frage an den Agenten: nur den Ort nennen lassen, nichts öffnen.</text></svg>