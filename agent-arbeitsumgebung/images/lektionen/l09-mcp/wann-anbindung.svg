<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" width="1000" height="492"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="492" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Projektordner oder Anbindung?</text><rect x="220" y="62" width="560" height="74" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="500" y="94" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">Liegen die Daten für den Auftrag</text><text x="500" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">als Datei im Ordner?</text><path d="M330,140 L330,176 L250,176 L250,206" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M670,140 L670,176 L750,176 L750,206" stroke="#0052ff" stroke-width="2" fill="none" marker-end="url(#ab)"/><text x="318" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#52525b" text-anchor="end">ja</text><text x="682" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0052ff" text-anchor="start">nein</text><rect x="30" y="210" width="440" height="192" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><path d="M58,236 L76,236 L82,242 L82,268 L58,268 Z" stroke="#18181b" stroke-width="2" fill="#ffffff"/><line x1="63" y1="246" x2="77" y2="246" stroke="#18181b" stroke-width="1.5"/><line x1="63" y1="253" x2="77" y2="253" stroke="#18181b" stroke-width="1.5"/><line x1="63" y1="260" x2="77" y2="260" stroke="#18181b" stroke-width="1.5"/><text x="100" y="258" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start">Der Projektordner reicht</text><text x="54" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Beispiel: das Protokoll der</text><text x="54" y="321" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Teambesprechung, als Datei abgelegt</text><text x="54" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Ohne MCP-Server läuft alles, was bisher im</text><text x="54" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Ordner lief.</text><rect x="530" y="210" width="440" height="192" rx="12" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><ellipse cx="570" cy="242" rx="14" ry="5" stroke="#0052ff" stroke-width="2" fill="#ffffff"/><path d="M556,242 L556,262 Q570,269 584,262 L584,242" stroke="#0052ff" stroke-width="2" fill="#ffffff"/><text x="600" y="258" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0052ff" text-anchor="start">Anbindung über einen MCP-Server</text><text x="554" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Beispiel: Dokumente in der Cloud-Ablage,</text><text x="554" y="321" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">die das Team laufend ändert</text><text x="554" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Erste Wahl: der offizielle Server des</text><text x="554" y="385" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Anbieters</text><rect x="30" y="426" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="454.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Im Unternehmen gibt meist die IT eine Anbindung frei, beim eigenen Konto die Person, der es gehört.</text></svg>