<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="540" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Ein Server, zwei Arten von Werkzeugen</text><rect x="30" y="70" width="220" height="196" rx="12" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><ellipse cx="140" cy="120" rx="14" ry="5" stroke="#18181b" stroke-width="2" fill="#ffffff"/><path d="M126,120 L126,140 Q140,147 154,140 L154,120" stroke="#18181b" stroke-width="2" fill="#ffffff"/><text x="140" y="186" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle">Kalender-Server</text><text x="140" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">außerhalb des</text><text x="140" y="233" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Projektordners</text><line x1="254" y1="168" x2="300" y2="118" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="304" y="78" width="666" height="80" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="326" y="112" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#18181b" text-anchor="start">termine_lesen</text><rect x="475.04200000000003" y="91" width="70.0" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="510.04200000000003" y="109" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">liest</text><text x="326" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Im schlimmsten Fall zeigt es etwas Falsches an.</text><line x1="254" y1="168" x2="300" y2="218" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="304" y="178" width="666" height="80" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="326" y="212" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#18181b" text-anchor="start">termin_anlegen</text><rect x="485.27599999999995" y="191" width="79.6" height="28" rx="14.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="525.0759999999999" y="209" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#d97706" text-anchor="middle">ändert</text><text x="326" y="240" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Legt echte Termine an, die andere Menschen sehen.</text><text x="30" y="316" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start">Vor jeder Anbindung klären</text><circle cx="48" cy="358" r="16" fill="#0052ff"/><text x="48" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="76" y="340" width="894" height="36" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="94" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Welche Werkzeuge stellt der Server bereit?</text><circle cx="48" cy="406" r="16" fill="#0052ff"/><text x="48" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="76" y="388" width="894" height="36" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="94" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Welche davon ändern etwas?</text><circle cx="48" cy="454" r="16" fill="#0052ff"/><text x="48" y="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="76" y="436" width="894" height="36" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="94" y="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Wer hat die Anbindung geprüft?</text><rect x="30" y="484" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="512.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Erste Wahl ist der offizielle Server des Anbieters, im Unternehmen mit Freigabe der IT.</text></svg>