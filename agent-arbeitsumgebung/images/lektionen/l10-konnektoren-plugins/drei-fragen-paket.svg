<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="520" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Drei Fragen an jedes Paket</text><rect x="30" y="62" width="940" height="116" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><circle cx="62" cy="92" r="16" fill="#0052ff"/><text x="62" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="92" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start">Wer hat es gebaut?</text><rect x="92" y="112" width="233.2" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="208.6" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Hersteller des Agenten</text><rect x="335.2" y="112" width="223.6" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="447.0" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Anbieter des Dienstes</text><rect x="568.8" y="112" width="118.0" height="28" rx="14.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="627.8" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Unbekannte</text><text x="92" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Unbekannte Herkunft: nur nach Prüfung durch die IT einschalten.</text><rect x="30" y="196" width="940" height="116" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><circle cx="62" cy="226" r="16" fill="#0052ff"/><text x="62" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="92" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start">Welche Rechte bekommt es?</text><rect x="92" y="246" width="108.39999999999999" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="146.2" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">nur lesen</text><rect x="210.39999999999998" y="246" width="156.4" height="28" rx="14.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="288.59999999999997" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">auch schreiben</text><rect x="376.79999999999995" y="246" width="137.2" height="28" rx="14.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="445.4" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">auch löschen</text><rect x="524.0" y="246" width="127.6" height="28" rx="14.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="587.8" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">auch senden</text><text x="92" y="298" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Ab „schreiben“: Rückfrage vor jeder Aktion.</text><rect x="30" y="330" width="940" height="116" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><circle cx="62" cy="360" r="16" fill="#0052ff"/><text x="62" y="366" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="92" y="366" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start">Was lädt es in jede Sitzung?</text><rect x="92" y="380" width="79.6" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="131.8" y="398" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Regeln</text><rect x="181.6" y="380" width="79.6" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="221.39999999999998" y="398" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Skills</text><rect x="271.2" y="380" width="233.2" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="387.79999999999995" y="398" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Werkzeugbeschreibungen</text><text x="92" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Das belegt Platz in jeder Sitzung. Nicht genutzte Pakete abschalten.</text><rect x="30" y="462" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="490.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Erst mit drei Antworten einschalten. Das gilt auch für Pakete, die schon aktiv sind.</text></svg>