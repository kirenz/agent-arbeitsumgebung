<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="590" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Wer schreibt, wer fragt, wer führt aus</text><rect x="30" y="62" width="700" height="440" rx="16" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="54" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start">Rahmen: die App</text><rect x="54" y="120" width="230" height="130" rx="12" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="169" y="156" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0052ff" text-anchor="middle">Sprachmodell</text><text x="169" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="middle">liest den Verlauf,</text><text x="169" y="206" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="middle">schreibt Text</text><text x="169" y="236" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">mehr nicht</text><rect x="330" y="120" width="380" height="62" rx="10" fill="#ffffff" stroke="#0052ff" stroke-width="1.5"/><circle cx="356" cy="151.0" r="16" fill="#0052ff"/><text x="356" y="157.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="382" y="145.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Wunsch als Text: Mail an</text><text x="382" y="166.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">test@example.com senden</text><line x1="520.0" y1="184" x2="520.0" y2="196" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="198" width="380" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><circle cx="356" cy="229.0" r="16" fill="#0052ff"/><text x="356" y="235.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="382" y="233.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">App erkennt den Wunsch und hält an</text><line x1="520.0" y1="262" x2="520.0" y2="274" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="276" width="380" height="62" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><circle cx="356" cy="307.0" r="16" fill="#0052ff"/><text x="356" y="313.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="382" y="311.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">App fragt: E-Mail senden?</text><line x1="520.0" y1="340" x2="520.0" y2="352" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="354" width="380" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><circle cx="356" cy="385.0" r="16" fill="#0052ff"/><text x="356" y="391.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="382" y="389.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">App führt das Werkzeug aus</text><line x1="520.0" y1="418" x2="520.0" y2="430" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="432" width="380" height="62" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><circle cx="356" cy="463.0" r="16" fill="#0052ff"/><text x="356" y="469.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="382" y="467.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Ergebnis zurück an das Modell</text><line x1="288" y1="151" x2="326" y2="151" stroke="#0052ff" stroke-width="2" marker-end="url(#ab)"/><path d="M326,463.0 L169,463.0 L169,254" stroke="#0052ff" stroke-width="2" fill="none" marker-end="url(#ab)"/><line x1="714" y1="307.0" x2="816" y2="307.0" stroke="#d97706" stroke-width="2" marker-end="url(#a)"/><circle cx="846" cy="294" r="7" stroke="#18181b" stroke-width="2" fill="#ffffff"/><path d="M833,317 Q833,303 846,303 Q859,303 859,317" stroke="#18181b" stroke-width="2" fill="#ffffff"/><text x="846" y="346" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle">Mensch im Chat</text><text x="846" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Erlauben oder</text><text x="846" y="388" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Ablehnen</text><rect x="760" y="410" width="210" height="92" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="865" y="444" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle">Paket mit</text><text x="865" y="466" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle">Senderecht</text><text x="865" y="490" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">bringt das Werkzeug</text><path d="M760,456 L736,456 L736,385.0 L714,385.0" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="528" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="556.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Die Rückfrage stellt der Rahmen, nicht das Modell. Ein Paket erweitert den Rahmen um Werkzeuge.</text></svg>