iel)</text><text x="200" y="388" font-family="ui-monospace, Menlo, monospace" font-size="16" xml:space="preserve"><tspan fill="#0052ff" font-weight="700">[</tspan><tspan fill="#18181b" font-weight="400">Preisliste</tspan><tspan fill="#0052ff" font-weight="700">](</tspan><tspan fill="#18181b" font-weight="400">preisliste-2026.md</tspan><tspan fill="#0052ff" font-weight="700">)</tspan></text><text x="620" y="126" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b" text-anchor="start">Überschrift</text><circle cx="623" cy="185" r="3" fill="#18181b"/><text x="636" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Listenpunkt</text><rect x="620" y="235" width="110" height="30" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/><text x="630" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Datei</text><rect x="730" y="235" width="110" height="30" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/><text x="740" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start">Anliegen</text><text x="620" y="322" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#18181b">ein <tspan font-weight="700">wichtiges</tspan> Wort</text><text x="620" y="388" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#0052ff" text-decoration="underline">Preisliste</text><text x="711.2" y="388" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">öffnet die Datei im Ordner</text><rect x="30" y="438" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="466" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Der Agent liest den