<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="650" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Derselbe Fall, zwei Wege: Chat oder Agent</text><rect x="30" y="60" width="455" height="506" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="257.5" y="95" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Chat-Assistent</text><text x="257.5" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">wie ein Berater am Telefon</text><rect x="67.5" y="150" width="380" height="64" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="257.5" y="176.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Beschwerde vorlesen</text><text x="257.5" y="198.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Text in den Chat kopieren</text><rect x="67.5" y="264" width="380" height="64" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="257.5" y="290.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Chat</text><text x="257.5" y="312.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">kennt nur, was im Chat steht</text><rect x="67.5" y="378" width="380" height="64" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="257.5" y="404.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Antworttext im Chat</text><text x="257.5" y="426.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">von Hand in eine Datei übertragen</text><line x1="257.5" y1="218" x2="257.5" y2="258" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><line x1="257.5" y1="332" x2="257.5" y2="372" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><text x="257.5" y="490" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">kein Zugang zum Ordner</text><rect x="515" y="60" width="455" height="506" rx="12" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="742.5" y="95" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0052ff" text-anchor="middle">Agent</text><text x="742.5" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">wie ein neuer Mitarbeiter mit Zugang zur Ablage</text><rect x="542.5" y="140" width="400" height="84" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="742.5" y="165.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Ziel</text><text x="742.5" y="187.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Lies die Beschwerde und lege einen</text><text x="742.5" y="208.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Antwortentwurf ab.</text><rect x="542.5" y="240" width="175" height="124" rx="10" fill="#ffffff" stroke="#0052ff" stroke-width="1.5"/><text x="630.0" y="264.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0052ff" text-anchor="middle">Agent</text><text x="630.0" y="286.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">beobachten,</text><text x="630.0" y="307.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">überlegen,</text><text x="630.0" y="328.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">handeln,</text><text x="630.0" y="349.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">wiederholen</text><rect x="817.5" y="240" width="125" height="124" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><path d="M868.0,256 L886.0,256 L892.0,262 L892.0,288 L868.0,288 Z" stroke="#18181b" stroke-width="2" fill="#ffffff"/><line x1="873.0" y1="266" x2="887.0" y2="266" stroke="#18181b" stroke-width="1.5"/><line x1="873.0" y1="273" x2="887.0" y2="273" stroke="#18181b" stroke-width="1.5"/><line x1="873.0" y1="280" x2="887.0" y2="280" stroke="#18181b" stroke-width="1.5"/><text x="880.0" y="314" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Ordner</text><text x="880.0" y="335" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Anfragen</text><text x="880.0" y="355" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Antworten</text><text x="767.5" y="284" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Werkzeuge</text><line x1="721.5" y1="300" x2="813.5" y2="300" stroke="#0052ff" stroke-width="2" marker-end="url(#ab)"/><line x1="813.5" y1="320" x2="721.5" y2="320" stroke="#0052ff" stroke-width="2" marker-end="url(#ab)"/><text x="767.5" y="388" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0052ff" text-anchor="middle">lesen, suchen, anlegen</text><rect x="542.5" y="404" width="400" height="64" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="742.5" y="430.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">fragt vor Änderungen</text><text x="742.5" y="452.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Erlauben oder Ablehnen im Chat</text><rect x="542.5" y="482" width="400" height="64" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="742.5" y="508.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Ergebnis: Datei im Ordner</text><text x="742.5" y="530.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">bleibt liegen, Meldung im Chat</text><rect x="30" y="584" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="612" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Der Agent erinnert sich nicht an gestern. Darum liegt alles Wichtige als Datei im Ordner.</text></svg>