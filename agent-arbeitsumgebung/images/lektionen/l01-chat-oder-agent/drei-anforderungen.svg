<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="440" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Drei Anforderungen an das Werkzeug, drei Prüfungen</text><circle cx="52" cy="112.0" r="16" fill="#0052ff"/><text x="52" y="118.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="86" y="70" width="560" height="84" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="366.0" y="106.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Dateien lesen, anlegen und ändern</text><text x="366.0" y="128.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">in einem Ordner auf dem eigenen Rechner</text><line x1="654" y1="112.0" x2="694" y2="112.0" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="70" width="270" height="84" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="835.0" y="95.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Prüfung: erster Auftrag</text><text x="835.0" y="117.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Der Agent legt hallo.md an</text><text x="835.0" y="138.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">und zeigt sie.</text><circle cx="52" cy="212.0" r="16" fill="#0052ff"/><text x="52" y="218.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="86" y="170" width="560" height="84" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="366.0" y="206.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Vor Änderungen nachfragen</text><text x="366.0" y="228.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">oder die Änderung zur Prüfung zeigen</text><line x1="654" y1="212.0" x2="694" y2="212.0" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="170" width="270" height="84" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="835.0" y="206.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Prüfung: erster Auftrag</text><text x="835.0" y="228.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Rückfrage vor dem Anlegen</text><circle cx="52" cy="312.0" r="16" fill="#0052ff"/><text x="52" y="318.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="86" y="270" width="560" height="84" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="366.0" y="306.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Eine Anweisungsdatei lesen</text><text x="366.0" y="328.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">eine Datei mit Regeln im Ordner</text><line x1="654" y1="312.0" x2="694" y2="312.0" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="270" width="270" height="84" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="835.0" y="295.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Prüfung: Selbstauskunft</text><text x="835.0" y="317.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Der Agent nennt den</text><text x="835.0" y="338.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Dateinamen.</text><rect x="30" y="376" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="404" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Das Werkzeug ist frei wählbar. Es muss diese drei Dinge können.</text></svg>