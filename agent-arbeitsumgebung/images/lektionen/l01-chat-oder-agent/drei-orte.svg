<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Drei Orte, an denen Agenten arbeiten</text><rect x="30" y="70" width="290" height="256" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="48" y="110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">In einer Chat-App im Netz</text><text x="48" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">arbeitet im Browser mit den</text><text x="48" y="161" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Werkzeugen des Anbieters</text><rect x="355" y="70" width="290" height="256" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="373" y="110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">In einem automatischen</text><text x="373" y="134" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#18181b" text-anchor="start">Ablauf</text><text x="373" y="164" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">startet von selbst, etwa bei</text><text x="373" y="185" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">jeder neuen E-Mail</text><rect x="680" y="70" width="290" height="256" rx="12" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><rect x="751.6" y="56" width="204.4" height="28" rx="14.0" fill="#ffffff" stroke="#0052ff" stroke-width="1.2"/><text x="853.8000000000001" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">in diesen Lektionen</text><text x="698" y="110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0052ff" text-anchor="start">Auf dem eigenen Rechner</text><text x="698" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Coding-Agent: liest, legt an</text><text x="698" y="161" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">und ändert Dateien in einem</text><text x="698" y="182" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Ordner</text><rect x="698" y="210" width="120" height="44" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="758.0" y="236.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">App mit Chat</text><rect x="868" y="210" width="84" height="44" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="910.0" y="236.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">Ordner</text><line x1="822" y1="232.0" x2="864" y2="232.0" stroke="#0052ff" stroke-width="2" marker-end="url(#ab)"/><text x="698" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Aufträge, Rückfragen,</text><text x="698" y="303" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Antworten: alles im Chat</text><text x="500" y="365" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Die Schleife ist überall dieselbe: Ziel, beobachten, überlegen, handeln, wiederholen.</text></svg>