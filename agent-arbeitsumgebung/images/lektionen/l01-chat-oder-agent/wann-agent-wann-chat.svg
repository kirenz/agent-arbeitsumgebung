<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="440" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Wann lohnt sich der Agent?</text><rect x="30" y="90" width="430" height="70" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="245.0" y="129.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">Liegt das Material schon als Dateien vor?</text><rect x="30" y="230" width="430" height="70" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="245.0" y="269.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="middle">Soll das Ergebnis als Datei entstehen?</text><rect x="590" y="76" width="380" height="140" rx="10" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="610" y="110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0052ff" text-anchor="start">Agent im Ordner</text><text x="610" y="138" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">liest Dateien selbst, fragt vor</text><text x="610" y="159" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">Änderungen, legt das Ergebnis ab</text><text x="610" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">etwa: drei Anfragen im Ordner sortieren</text><rect x="590" y="280" width="380" height="110" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="610" y="314" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start">Chat</text><text x="610" y="342" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">eine kurze Frage ohne Material</text><text x="610" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start">etwa: eine Formulierung verbessern</text><line x1="464" y1="125" x2="584" y2="125" stroke="#0052ff" stroke-width="2" marker-end="url(#ab)"/><text x="524" y="116" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Ja</text><line x1="464" y1="255" x2="584" y2="190" stroke="#0052ff" stroke-width="2" marker-end="url(#ab)"/><text x="516" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Ja</text><path d="M245,302 L245,335 L584,335" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="415" y="326" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#52525b" text-anchor="middle">beides Nein</text><text x="500" y="425" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Eine Ja-Antwort genügt für den Agenten.</text></svg>