<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="1000" height="960"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="960" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle">Der Weg eines Auftrags: vom Auftrag zur Datei</text><rect x="30" y="56" width="300" height="58" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="180" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle">Chat</text><text x="180" y="103" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">Auftrag und Freigabe</text><line x1="180" y1="120" x2="180" y2="886" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 5"/><rect x="350" y="56" width="300" height="58" rx="10" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="500" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0052ff" text-anchor="middle">Agent</text><text x="500" y="103" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">überlegt und wählt</text><line x1="500" y1="120" x2="500" y2="886" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 5"/><rect x="670" y="56" width="300" height="58" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="820" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle">App</text><text x="820" y="103" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle">führt aus und fragt</text><line x1="820" y1="120" x2="820" y2="886" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 5"/><rect x="45.0" y="140" width="270" height="66" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="59.0" y="172.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Auftrag: terminwunsch.md</text><text x="59.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">anlegen, vorher fragen</text><rect x="365.0" y="236" width="270" height="66" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="379.0" y="278.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Der Ordner ist leer.</text><rect x="365.0" y="332" width="270" height="66" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="379.0" y="364.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Inhalt: Überschrift und</text><text x="379.0" y="385.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Liste mit drei Angaben</text><rect x="365.0" y="428" width="270" height="66" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="379.0" y="460.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">wählt das Werkzeug „Datei</text><text x="379.0" y="481.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">anlegen“</text><rect x="685.0" y="524" width="270" height="66" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="699.0" y="551.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">fragt: Datei anlegen?</text><text x="699.0" y="572.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Erlauben / Ablehnen</text><rect x="45.0" y="620" width="270" height="66" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="59.0" y="657.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Freigabe: Erlauben</text><rect x="685.0" y="716" width="270" height="66" rx="10" fill="#ffffff" stroke="#0052ff" stroke-width="1.5"/><text x="699.0" y="743.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">legt terminwunsch.md an und</text><text x="699.0" y="764.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">meldet es</text><rect x="365.0" y="812" width="270" height="66" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="379.0" y="844.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">Fertig. Eine Datei</text><text x="379.0" y="865.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start">angelegt, keine geändert.</text><rect x="57.0" y="126" width="60.4" height="28" rx="14.0" fill="#ffffff" stroke="#0052ff" stroke-width="1.2"/><text x="87.2" y="144" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Ziel</text><rect x="377.0" y="222" width="118.0" height="28" rx="14.0" fill="#ffffff" stroke="#0052ff" stroke-width="1.2"/><text x="436.0" y="240" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Beobachten</text><rect x="377.0" y="318" width="108.39999999999999" height="28" rx="14.0" fill="#ffffff" stroke="#0052ff" stroke-width="1.2"/><text x="431.2" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Überlegen</text><rect x="377.0" y="414" width="89.2" height="28" rx="14.0" fill="#ffffff" stroke="#0052ff" stroke-width="1.2"/><text x="421.6" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Handeln</text><rect x="377.0" y="798" width="146.8" height="28" rx="14.0" fill="#ffffff" stroke="#0052ff" stroke-width="1.2"/><text x="450.4" y="816" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle">Ziel erreicht</text><path d="M180,208 L180,269.0 L362.0,269.0" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><line x1="570" y1="304" x2="570" y2="329" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><line x1="570" y1="400" x2="570" y2="425" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><path d="M500,496 L500,557.0 L682.0,557.0" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M820,592 L820,653.0 L318.0,653.0" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M180,688 L180,749.0 L682.0,749.0" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M820,784 L820,845.0 L638.0,845.0" stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="902" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="930" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start">Den Text schreibt der Agent. Die Datei legt die App an, und sie fragt vorher.</text></svg>