project:
  type: book
  output-dir: _book
  # Der Buchteil liegt komplett in agent-arbeitsumgebung/. Kursbücher binden
  # genau diesen Ordner per git subtree ein (Branch `teil`, siehe README).
  # Alle Pfade im Teil sind relativ, damit sie in jedem Kursbuch gelten.
  render:
    - "*.qmd"
    - "agent-arbeitsumgebung/*.qmd"
  resources:
    - "agent-arbeitsumgebung/widgets/*"
    - "agent-arbeitsumgebung/downloads/*"
    - "agent-arbeitsumgebung/images/*"
    - "agent-arbeitsumgebung/images/lektionen/*/*"

lang: de

execute:
  freeze: auto

book:
  title: "Produktiv mit einem Agenten arbeiten"
  description: "Projektordner, Markdown, AGENTS.md, Skills und MCP für Coding-Agenten, unabhängig vom Werkzeug"
  author: "Jan Kirenz"
  # Navigation läuft über die Plattform, nicht über das eingebettete Buch.
  page-navigation: false

  search:
    type: overlay
  page-footer:
    left: |
      © [Jan Kirenz](https://www.kirenz.com/), 2026

  chapters:
    - index.qmd

    - part: agent-arbeitsumgebung/index.qmd
      chapters:
        - agent-arbeitsumgebung/chat-oder-agent.qmd
        - agent-arbeitsumgebung/markdown.qmd
        - agent-arbeitsumgebung/projektordner.qmd
        - agent-arbeitsumgebung/erstes-material.qmd
        - agent-arbeitsumgebung/agents-md.qmd
        - agent-arbeitsumgebung/kontext-bereitstellen.qmd
        - agent-arbeitsumgebung/pdf-als-quelle.qmd
        - agent-arbeitsumgebung/excel-als-quelle.qmd
        - agent-arbeitsumgebung/laufend-neue-dateien.qmd
        - agent-arbeitsumgebung/skills.qmd

    - part: agent-arbeitsumgebung/erweitern.qmd
      chapters:
        - agent-arbeitsumgebung/mcp.qmd
        - agent-arbeitsumgebung/konnektoren-plugins.qmd

format:
  html:
    toc: true
    theme:
      - cosmo
      - book-theme.scss
    code-copy: true
    highlight-style: github
    code-overflow: wrap
    author-meta: "Jan Kirenz"
    callout-appearance: simple
